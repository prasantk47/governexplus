# Alembic Configuration File
#
# The live database URL is supplied via the DATABASE_URL environment variable.
# The sqlalchemy.url value below is a fallback for offline tooling only.
# To override: export DATABASE_URL=postgresql://user:pass@host:5432/dbname

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Naming template for generated migration files
# Example: 20260821_143055_add_tenant_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Max length of the slug appended to migration filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during 'alembic revision'
revision_environment = false

# Allow detection of .pyc files without a matching .py source file
sourceless = false

# Version path separator (os = platform default)
version_path_separator = os

# Output encoding used when writing revision files via script.py.mako
output_encoding = utf-8

# Default database URL (development SQLite fallback).
# In production this is ALWAYS overridden by the DATABASE_URL env var
# loaded in alembic/env.py via python-dotenv.
sqlalchemy.url = sqlite:///./grc_platform.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
