apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governexplus-network-policy
  namespace: governexplus
spec:
  podSelector:
    matchLabels:
      app: governexplus-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to: # Allow DNS
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  - to: # Allow HTTPS outbound (LLM APIs, connectors)
    ports:
    - protocol: TCP
      port: 443
